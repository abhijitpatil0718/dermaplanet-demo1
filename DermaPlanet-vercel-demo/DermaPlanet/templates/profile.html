{% extends "base.html" %}
{% block title %}Your profile | DermaPlanet{% endblock %}
{% block content %}
<section class="page-head">
  <h1>Your profile</h1>
  <p class="lead">{{ g.user['email'] }}</p>
</section>
<section class="section two-col">
  <form class="form-card" method="post" novalidate>
    {{ csrf_field() }}
    <h2>Details</h2>
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" maxlength="80" value="{{ g.user['name'] }}" required>
    <label for="phone">Mobile number</label>
    <input id="phone" name="phone" type="tel" inputmode="numeric" value="{{ g.user['phone'] or '' }}" {% if not g.user['is_admin'] %}required{% endif %}>
    <button class="btn btn-primary" type="submit">Save details</button>
  </form>
  <form class="form-card" method="post" action="{{ url_for('change_password') }}" novalidate>
    {{ csrf_field() }}
    <h2>Change password</h2>
    <label for="current">Current password</label>
    <input id="current" name="current" type="password" autocomplete="current-password" required>
    <label for="new">New password</label>
    <input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint">At least 8 characters, with a letter and a number.</p>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
</section>
{% endblock %}
